services:
  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    env_file: ${API_ENV_FILE:-./api/.env}
    environment:
      DATABASE_PATH: /app/data/ubc.sqlite
    volumes:
      - ${DATA_DIR:-./api/data}:/app/data
    user: node
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "5"
