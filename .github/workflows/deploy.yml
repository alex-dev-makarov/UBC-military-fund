name: Deploy API to prod

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prod
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter api test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment: production
    # Values come from GitHub → Settings → Secrets and variables → Actions.
    steps:
      - name: Save the deploy key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PROD_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      # Known fingerprint of our server, so we never talk to an impostor.
      - name: Trust the server
        run: echo "${{ secrets.PROD_SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      # The key only runs deploy/server-deploy.sh on the server, nothing else.
      - name: Deploy
        run: ssh -i ~/.ssh/deploy_key root@${{ secrets.PROD_SSH_HOST }}
